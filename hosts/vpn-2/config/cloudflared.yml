# The proxy entry points of this node, plus the one page that has to answer
# from this node alone: handing out a new peer keeps state, and state lives
# in one place.
tunnel: 11111111-1111-1111-1111-111111111111
credentials-file: /root/.cloudflared/11111111-1111-1111-1111-111111111111.json
protocol: quic
ingress:
  - hostname: gw.example.net
    path: ^/xh
    service: http://localhost:8082
  - hostname: gw.example.net
    service: http://localhost:8080
  - hostname: cfg.example.net
    service: http://localhost:8081
  - service: http_status:404
