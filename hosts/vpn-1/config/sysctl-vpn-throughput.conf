# Tuned for what this box actually carries: long paths from Russian mobile
# networks, where loss is normal and not a sign of congestion.

# Loss-based control reads that loss as a full queue and backs off, giving away
# most of the available speed.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# A proxy connection idles between page loads; restarting cold makes the next
# load pay for the pause.
net.ipv4.tcp_slow_start_after_idle = 0

# Mobile networks drop oversized packets without saying so, which stalls a
# connection instead of slowing it.
net.ipv4.tcp_mtu_probing = 1

# Buffers below one round trip of data let distance alone cap the speed.
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 131072 16777216
net.ipv4.tcp_wmem = 4096 16384 16777216
